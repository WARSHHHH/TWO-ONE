<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="TWO/ONE — обсудить проект. Заполните форму, мы ответим в течение дня.">
  <meta name="theme-color" content="#111111">
  <title>TWO/ONE — Обсудить проект</title>

  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=JetBrains+Mono&family=Literata:wght@400;600&family=Onest:wght@400;500;700;800&family=Rubik+Mono+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body class="contact-page">

  <header class="header">
    <a class="logo" href="index.html">TWO/ONE</a>

    <a class="icon-btn header-contact" href="index.html" aria-label="Назад на главную">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 5 5 19M16 19H5V8"/>
      </svg>
    </a>
  </header>

  <main class="contact-main">
    <section class="contact-hero">

      <div class="eyebrow">Есть идея? — Давай соберём.</div>

      <h1 class="reveal">
        Расскажите<br>
        <span>о проекте.</span>
      </h1>

      <p class="contact-intro reveal reveal-delay-1">
        Заполните форму — мы ответим в течение дня, зададим нужные вопросы
        и обсудим следующие шаги.
      </p>

      <form
        class="contact-form reveal reveal-delay-2"
        action="https://formspree.io/f/xwlvrqde"
        method="POST"
        novalidate
      >
        <div class="form-row">
          <label class="field">
            <span>Ваше имя</span>
            <input
              type="text"
              name="name"
              required
              autocomplete="name"
              placeholder="Иван"
            >
          </label>

          <label class="field">
            <span>Email</span>
            <input
              type="email"
              name="email"
              required
              autocomplete="email"
              placeholder="you@example.com"
            >
          </label>
        </div>

        <div class="form-row">
          <label class="field">
            <span>Telegram <em>(необязательно)</em></span>
            <input
              type="text"
              name="telegram"
              placeholder="@username"
            >
          </label>

          <label class="field">
            <span>Бюджет</span>
            <select name="budget">
              <option value="">Не указан</option>
              <option>до 30 000 ₽</option>
              <option>30 000 – 80 000 ₽</option>
              <option>80 000 – 150 000 ₽</option>
              <option>от 150 000 ₽</option>
            </select>
          </label>
        </div>

        <label class="field">
          <span>Что нужно сделать</span>
          <select name="type" required>
            <option value="" disabled selected>Выберите…</option>
            <option>Лендинг</option>
            <option>Корпоративный сайт</option>
            <option>Интернет-магазин</option>
            <option>Дизайн + разработка</option>
            <option>Только дизайн</option>
            <option>Только разработка</option>
            <option>Другое</option>
          </select>
        </label>

        <label class="field">
          <span>О проекте</span>
          <textarea
            name="message"
            rows="6"
            required
            placeholder="Пара слов о задаче, сроках и референсах…"
          ></textarea>
        </label>

        <!-- Скрытые поля Formspree -->
        <input type="hidden" name="_subject" value="TWO/ONE — новая заявка">
        <input type="text" name="_gotcha" style="display:none" tabindex="-1" autocomplete="off">

        <div class="form-actions">
          <button type="submit" class="submit-btn">
            Отправить
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M5 19 19 5M8 5h11v11"/>
            </svg>
          </button>

          <p class="form-note">
            Или напишите напрямую —
            <a href="https://t.me/sematarygravema" target="_blank" rel="noopener noreferrer">Telegram</a>
          </p>
        </div>
      </form>

    </section>
  </main>

  <footer class="footer">© TWO/ONE</footer>

  <div class="cursor-glow" aria-hidden="true"></div>

  <script src="script.js" defer></script>
</body>
</html>
